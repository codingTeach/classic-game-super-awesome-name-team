<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>

</head>
<body>
    <a-scene>
        <a-box color="red" width="3" height="3"
            depth="3" rotation="0 0 0" position="2 2 -7"
            animation="
            property: rotation;
            from: 0 0 0;
            to: 0 45 0;
            dur: 3000;
            loop: true;
            dir: alternate;
            "
        ></a-box>
        <!-- Este es mio jonathan-->
        <a-cone color="yellow" radius-bottom=".5" radius-top="3" position="8 5 -15" height="3" animation="
                property: rotation;
                from: 0 0 0;
                to: 180 0 0;
                loop: true;
                dir: alternate;
                " material="" geometry=""></a-cone>
    
</body>
</html>
