<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
</head>

<body>
  <a-scene id="scene" physics="debug: false">
    

    <!-- Camera / player -->
    <a-entity id="player"
      camera
      look-controls
      wasd-controls="acceleration: 25"
      kinematic-body="shape: sphere; radius: 0.35"
      player-collider="colliders: .wall; radius: 0.35"
      exit-check="door: #exit-door; threshold: 1.2">

      <a-entity id="player-avatar" position="0 -1.2 0">
        <a-cylinder height="1.2" radius="0.25" color="#bdb26e"></a-cylinder>
        <a-sphere radius="0.3" position="0 0.9 0" color="#bdb26e"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- Enemy -->
    <a-entity id="chaser"
      position="0 0.8 0"
      dynamic-body="mass: 1; linearDamping: 0.8; angularDamping: 0.9"
      chaser="speed: 2.2; target: #player">
      <a-box height="1.6" width="0.8" depth="0.8" color="#7a1d1d"></a-box>
    </a-entity>

    <!-- Floor / maze / exit -->
    <a-plane id="floor" rotation="-90 0 0" color="#222" static-body></a-plane>
    <a-entity id="maze"></a-entity>
    <a-box id="exit-door" color="#c9a44a" depth="0.4" height="2.5" width="1.2"></a-box>

    <!-- Light -->
    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="point" position="0 5 0"></a-light>
  </a-scene>

  <script>
    AFRAME.registerComponent('chaser', {
      schema: {
        speed: { type: 'number', default: 2.2 },
        target: { type: 'selector' }
      },
      tick: function () {
        if (!this.el.body || !this.data.target) return;

        const pos = this.el.object3D.position;
        const tpos = this.data.target.object3D.position;
        const dir = new THREE.Vector3(tpos.x - pos.x, 0, tpos.z - pos.z);
        const dist = dir.length();

        if (dist < 0.2) {
          this.el.body.velocity.set(0, this.el.body.velocity.y, 0);
          return;
        }

        dir.normalize();
        this.el.body.velocity.set(dir.x * this.data.speed, this.el.body.velocity.y, dir.z * this.data.speed);
      }
    });

    AFRAME.registerComponent('exit-check', {
      schema: {
        door: { type: 'selector' },
        threshold: { type: 'number', default: 1.2 }
      },
      tick: function () {
        if (!this.data.door) return;
        const p = this.el.object3D.position;
        const d = this.data.door.object3D.position;
        if (p.distanceTo(d) <= this.data.threshold) {
          this.el.emit('exit-reached');
        }
      }
    });

    AFRAME.registerComponent('player-collider', {
      schema: {
        colliders: { type: 'string' },
        radius: { type: 'number', default: 0.35 }
      },
      init: function () {
        this.prevPos = new THREE.Vector3();
        this.currPos = new THREE.Vector3();
        this.playerBox = new THREE.Box3();
        this.tempBox = new THREE.Box3();
        this.colliders = [];
        this.refreshColliders();
      },
      refreshColliders: function () {
        const nodes = document.querySelectorAll(this.data.colliders || '');
        this.colliders = Array.prototype.slice.call(nodes);
      },
      tick: function () {
        if (!this.el.object3D) return;

        this.prevPos.copy(this.currPos);
        this.currPos.copy(this.el.object3D.position);

        this.playerBox.setFromCenterAndSize(
          this.currPos,
          new THREE.Vector3(this.data.radius * 2, 1.6, this.data.radius * 2)
        );

        for (let i = 0; i < this.colliders.length; i++) {
          const wallEl = this.colliders[i];
          if (!wallEl.object3D) continue;
          this.tempBox.setFromObject(wallEl.object3D);
          if (this.playerBox.intersectsBox(this.tempBox)) {
            this.el.object3D.position.set(this.prevPos.x, this.currPos.y, this.prevPos.z);
            this.currPos.copy(this.el.object3D.position);
            break;
          }
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const player = document.getElementById('player');
      const floor = document.getElementById('floor');
      const maze = document.getElementById('maze');
      const door = document.getElementById('exit-door');
      const chaser = document.getElementById('chaser');

      let levelIndex = 0;
      let transitioning = false;

      function getLevelConfig(index) {
        const growth = Math.min(index, 4);
        return {
          rows: 10 + growth * 2,
          cols: 10 + growth * 2,
          cellSize: 4.4,
          wallHeight: 3,
          wallThickness: 0.4,
          extraOpen: Math.min(0.45, 0.25 + index * 0.05)
        };
      }

      function createCells(rows, cols) {
        return Array.from({ length: rows }, () =>
          Array.from({ length: cols }, () => ({
            n: true, e: true, s: true, w: true, visited: false
          }))
        );
      }

      function carveWall(cells, r, c, dir) {
        const cell = cells[r][c];
        if (dir === 'n' && r > 0) {
          cell.n = false;
          cells[r - 1][c].s = false;
        } else if (dir === 'e' && c < cells[0].length - 1) {
          cell.e = false;
          cells[r][c + 1].w = false;
        } else if (dir === 's' && r < cells.length - 1) {
          cell.s = false;
          cells[r + 1][c].n = false;
        } else if (dir === 'w' && c > 0) {
          cell.w = false;
          cells[r][c - 1].e = false;
        }
      }

      function generateMaze(rows, cols) {
        const cells = createCells(rows, cols);
        const stack = [];
        let current = { r: 0, c: 0 };
        cells[0][0].visited = true;

        while (true) {
          const { r, c } = current;
          const neighbors = [];

          if (r > 0 && !cells[r - 1][c].visited) neighbors.push({ r: r - 1, c, dir: 'n' });
          if (c < cols - 1 && !cells[r][c + 1].visited) neighbors.push({ r, c: c + 1, dir: 'e' });
          if (r < rows - 1 && !cells[r + 1][c].visited) neighbors.push({ r: r + 1, c, dir: 's' });
          if (c > 0 && !cells[r][c - 1].visited) neighbors.push({ r, c: c - 1, dir: 'w' });

          if (neighbors.length > 0) {
            const next = neighbors[Math.floor(Math.random() * neighbors.length)];
            carveWall(cells, r, c, next.dir);
            stack.push(current);
            current = { r: next.r, c: next.c };
            cells[current.r][current.c].visited = true;
          } else if (stack.length > 0) {
            current = stack.pop();
          } else {
            break;
          }
        }

        return cells;
      }

      function openUpMaze(cells, chance) {
        for (let r = 0; r < cells.length; r++) {
          for (let c = 0; c < cells[0].length; c++) {
            if (Math.random() < chance) carveWall(cells, r, c, 'e');
            if (Math.random() < chance) carveWall(cells, r, c, 's');
          }
        }
      }

      function addWall(x, z, width, depth, wallHeight) {
        const wall = document.createElement('a-box');
        wall.setAttribute('position', `${x} ${wallHeight / 2} ${z}`);
        wall.setAttribute('width', width);
        wall.setAttribute('height', wallHeight);
        wall.setAttribute('depth', depth);
        wall.setAttribute('color', '#666');
        wall.setAttribute('static-body', '');
        wall.classList.add('wall');
        maze.appendChild(wall);
      }

      function buildLevel(index) {
        maze.innerHTML = '';

        const config = getLevelConfig(index);
        const { rows, cols, cellSize, wallHeight, wallThickness, extraOpen } = config;

        const totalWidth = cols * cellSize;
        const totalDepth = rows * cellSize;
        const offsetX = -totalWidth / 2;
        const offsetZ = -totalDepth / 2;

        floor.setAttribute('width', totalWidth);
        floor.setAttribute('height', totalDepth);
        floor.setAttribute('position', '0 0 0');

        const cells = generateMaze(rows, cols);
        openUpMaze(cells, extraOpen);

        const exitCell = { r: rows - 1, c: cols - 1 };
        cells[exitCell.r][exitCell.c].s = false;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cell = cells[r][c];
            const x0 = offsetX + c * cellSize;
            const z0 = offsetZ + r * cellSize;

            if (cell.n) addWall(x0 + cellSize / 2, z0, cellSize, wallThickness, wallHeight);
            if (cell.w) addWall(x0, z0 + cellSize / 2, wallThickness, cellSize, wallHeight);
            if (r === rows - 1 && cell.s) addWall(x0 + cellSize / 2, z0 + cellSize, cellSize, wallThickness, wallHeight);
            if (c === cols - 1 && cell.e) addWall(x0 + cellSize, z0 + cellSize / 2, wallThickness, cellSize, wallHeight);
          }
        }

        const startX = offsetX + cellSize / 2;
        const startZ = offsetZ + cellSize / 2;
        player.setAttribute('position', `${startX} 1.6 ${startZ}`);

        const doorX = offsetX + exitCell.c * cellSize + cellSize / 2;
        const doorZ = offsetZ + (exitCell.r + 1) * cellSize;
        door.setAttribute('position', `${doorX} ${wallHeight / 2} ${doorZ}`);

        const chaserX = offsetX + (cols - 1) * cellSize + cellSize / 2;
        const chaserZ = offsetZ + (rows - 1) * cellSize + cellSize / 2;
        chaser.setAttribute('position', `${chaserX} 0.8 ${chaserZ}`);

        if (player.components['player-collider']) {
          player.components['player-collider'].refreshColliders();
        }
      }

      player.addEventListener('exit-reached', () => {
        if (transitioning) return;
        transitioning = true;
        levelIndex += 1;
        setTimeout(() => {
          buildLevel(levelIndex);
          transitioning = false;
        }, 250);
      });

      buildLevel(levelIndex);
    });
  </script>
</body>
</html>
