<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck Hunt VR - ECS Base</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="./js/game-manager.js"></script>
    <script src="./js/target-logic.js"></script>
    <script src="./js/hud-logic.js"></script>
    <script src="./js/weapon-logic.js"></script>
    <script src="./js/menu-button.js"></script>
  </head>
  <body>
    <a-scene background="color: #87ceeb" game-manager="roundTime: 90; bulletsPerBird: 3; totalBirds: 3" menu-button>
      <a-sky src="./src/mapas/bosque.jpg"></a-sky>
      <a-assets>
        <a-asset-item id="booth-model" src="./src/mapas/Brick wall.glb"></a-asset-item>
        <a-asset-item id="weapon-model" src="./src/personajes/pistola.glb"></a-asset-item>
        <a-asset-item id="black-bird-model" src="./src/personajes/blackBird.glb"></a-asset-item>
        <a-asset-item id="red-bird-model" src="./src/personajes/red_bird.glb"></a-asset-item>
        <a-asset-item id="yellow-bird-model" src="./src/personajes/yellowBird.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 0.9" position="2 6 4"></a-entity>

      <a-plane rotation="-90 0 0" width="60" height="60" src="./src/mapas/nieve.jpg"></a-plane>

      <a-entity id="dj-booth" gltf-model="#booth-model" position="0 0 -2" scale="2.5 2.5 2.5"></a-entity>

      <!--
        Sistema de generación procedural de aves:
        - Cada ave tiene una trayectoria única (punto A a punto B)
        - Sin rebotes: van en línea recta
        - Al completar la trayectoria, desaparecen y se regeneran con nueva ruta
        - Diferentes velocidades y tiempos para mayor variedad
        - Hitbox invisible para detectar disparos
      -->
      <a-entity
        id="bird-1"
        class="target"
        target-logic="
          movementAreaMin: -10 1.5 -12;
          movementAreaMax: 10 7 -2;
          speed: 2.5;
          respawnDelay: 1500;
          spawnHeight: 3.5;
          spawnHeightVariation: 2;
          flightDistance: 18;
        "
        scale="1 1 1"
      >
        <a-entity gltf-model="#black-bird-model"></a-entity>
        <a-box 
          class="bird-hitbox"
          width="0.8" 
          height="0.6" 
          depth="0.8" 
          opacity="0"
          material="transparent: true; opacity: 0"
        ></a-box>
      </a-entity>

      <a-entity
        id="bird-2"
        class="target"
        target-logic="
          movementAreaMin: -10 1.5 -12;
          movementAreaMax: 10 7 -2;
          speed: 3.0;
          respawnDelay: 2000;
          spawnHeight: 4;
          spawnHeightVariation: 2.5;
          flightDistance: 20;
        "
        scale="1 1 1"
      >
        <a-entity gltf-model="#red-bird-model"></a-entity>
        <a-box 
          class="bird-hitbox"
          width="0.8" 
          height="0.6" 
          depth="0.8" 
          opacity="0"
          material="transparent: true; opacity: 0"
        ></a-box>
      </a-entity>

      <a-entity
        id="bird-3"
        class="target"
        target-logic="
          movementAreaMin: -10 1.5 -12;
          movementAreaMax: 10 7 -2;
          speed: 3.5;
          respawnDelay: 2500;
          spawnHeight: 3;
          spawnHeightVariation: 2;
          flightDistance: 22;
        "
        scale="1 1 1"
      >
        <a-entity gltf-model="#yellow-bird-model"></a-entity>
        <a-box 
          class="bird-hitbox"
          width="0.8" 
          height="0.6" 
          depth="0.8" 
          opacity="0"
          material="transparent: true; opacity: 0"
        ></a-box>
      </a-entity>

      <a-entity id="rig" position="0 1.6 0">
        <a-camera>

          <a-cursor fuse="true" fuse-timeout="700" raycaster="objects: .target, .bird-hitbox; far: 50"></a-cursor>
          <!-- HUD mínimo en pantalla, desacoplado vía eventos del sistema global -->
          <a-entity id="hud" hud-logic position="1.2 0.8 -1.15" scale="0.95 0.95 0.95">
            <a-plane
              id="hud-bg"
              width="0.85"
              height="0.42"
              color="#0b1b2b"
              opacity="0.65"
              shader="flat"
              position="0.35 -0.12 -0.01"
            ></a-plane>
            <a-text id="hud-score" value="Puntaje: 0" color="#ffffff" width="1.6" position="0 0.02 0" align="left" anchor="left"></a-text>
            <a-text id="hud-ammo" value="Balas: 0" color="#ffffff" width="1.6" position="0 -0.08 0" align="left" anchor="left"></a-text>
            <a-text id="hud-time" value="Tiempo: 0s" color="#ffffff" width="1.6" position="0 -0.18 0" align="left" anchor="left"></a-text>
            <a-text id="hud-status" value="" color="#ffeb3b" width="1.8" position="0 -0.3 0" align="left" anchor="left"></a-text>
          </a-entity>

          <!-- BACK TO MENU BUTTON -->
          <a-box
            id="back-to-menu"
            width="0.3"
            height="0.08"
            depth="0.01"
            color="#FF6B6B"
            position="0.8 -0.9 -1.15"
            cursor-listener
          >
            <a-text
              value="MENU"
              color="#FFFFFF"
              width="0.5"
              position="0 0 0.01"
              align="center"
              anchor="center"
              scale="0.8 0.8 0.8"
            ></a-text>
          </a-box>

          <!--
            El arma es hija de cámara para mantener alineación con la vista.
            weapon-logic consulta game-manager (system) para gastar munición sin acoplarse a targets concretos.
          -->
          <a-entity
            id="weapon"
            position="0.2 -0.25 -0.42"
            rotation="0 -10 0"
            scale="0.06 0.06 0.06"
            gltf-model="#weapon-model"
            raycaster="objects: .target, .bird-hitbox; far: 50; showLine: false"
            weapon-logic="shootCooldown: 250; maxVisualSize: 0.22"
          ></a-entity>
        </a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
